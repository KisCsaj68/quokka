# Default values for assetcache.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: quokka/assetcache
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 8000

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

readinessProbe:
  httpGet:
    path: /healthz
    port: http

nodeSelector: {}

tolerations: []

affinity: {}

assetcache:
  config:
    apca:
      apiKeyId: PK32MITQOLOJKC0MYCRP
      secretKey: oQUjn55A2hymqm0o3tWvaFmacFNd0m8RbSzmxjE0
      baseUrl: https://paper-api.alpaca.markets/
      version: v2
      streamUrl: https://stream.data.alpaca.markets
    rabbit:
      host: rabbitmq
      port: 5672
      user: guest
      password: guest
      exchange: oms_exchange
      routingKey: filled_order_routing_key
      queue: filled_order_queue
    prometheus:
      multiprocDir: /tmp/metrics
    oms:
      host: oms
      port: 9000

prometheus:
  enabled: true
  additionalLabels:
    release: kube-prometheus-stack



