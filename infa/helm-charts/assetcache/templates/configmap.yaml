apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "assetcache.fullname" . }}
data:
  .env: |
    export APCA_API_KEY_ID={{ .Values.assetcache.config.apca.apiKeyId }}
    export APCA_API_SECRET_KEY={{ .Values.assetcache.config.apca.secretKey }} #TODO: move to secret
    export APCA_API_BASE_URL={{ .Values.assetcache.config.apca.baseUrl }}
    export APCA_API_VERSION={{ .Values.assetcache.config.apca.version }}
    export APCA_API_STREAM_URL={{ .Values.assetcache.config.apca.streamUrl }}
    export APCA_RETRY_WAIT=1
    export APCA_RETRY_MAX=50
    export RABBITMQ_URL="amqp://{{ .Values.assetcache.config.rabbit.user }}:{{ .Values.assetcache.config.rabbit.password }}@{{ .Values.assetcache.config.rabbit.host }}.{{ .Release.Namespace }}.svc:{{ .Values.assetcache.config.rabbit.port }}"
    export EXCHANGE={{ .Values.assetcache.config.rabbit.exchange }}
    export ROUTING_KEY={{ .Values.assetcache.config.rabbit.routingKey }}
    export QUEUE={{ .Values.assetcache.config.rabbit.queue }}
    export PROMETHEUS_MULTIPROC_DIR={{ .Values.assetcache.config.prometheus.multiprocDir }}